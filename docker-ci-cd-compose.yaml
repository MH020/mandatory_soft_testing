services:
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: addresses
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d addresses"]
      interval: 2s
      timeout: 3s
      retries: 30