info:
  name: Generate name + gender + DOB
  type: http
  seq: 2

http:
  method: GET
  url: "{{SERVER}}/api/name-gender-dob"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Contains name", function () {
          const body = res.getBody()
          expect(body.firstName).to.be.a('string');
        });

        test("Contains surname", function () {
          const body = res.getBody()
          expect(body.lastName).to.be.a('string');
        });

        test("Contains gender", function () {
          const body = res.getBody()
          expect(body.gender).to.be.a('string');
        });

        test("Contains date of birth", function () {
          const body = res.getBody()
          expect(body.birthDate).to.be.a('string');
        });

        test("Date of birth has the following signature: yyyy-mm-dd", function () {
          const body = res.getBody()
          
          expect(body.birthDate.length).to.equal(10);
          expect(body.birthDate.substring(0, 4)).to.match(/^\d+$/);
          expect(body.birthDate[4]).to.equal("-")
          expect(body.birthDate.substring(5, 7)).to.match(/^\d+$/);
          expect(body.birthDate[7]).to.equal("-")
          expect(body.birthDate.substring(8)).to.match(/^\d+$/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
