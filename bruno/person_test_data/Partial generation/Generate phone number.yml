info:
  name: Generate phone number
  type: http
  seq: 7

http:
  method: GET
  url: "{{SERVER}}/api/phone"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Get status code 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Get an 8 digit number", function () {
          expect(res.getBody().toString().length).to.equal(8);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
