info:
  name: Generate person(s) n=100
  type: http
  seq: 4

http:
  method: GET
  url: "{{SERVER}}/api/person/?n=100"
  params:
    - name: n
      value: "100"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("n=100 returns 100 people", function () {
          expect(res.getBody()).to.have.lengthOf(100);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
